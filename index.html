<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkVault - Your Bookmarks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23fb923c%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23ea580c%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2216%22%20fill=%22url%28%23g%29%22/%3E%3Cpath%20d=%22M20%2013h24a3%203%200%200%201%203%203v35l-15-9-15%209V16a3%203%200%200%201%203-3z%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2225%22%20r=%224.5%22%20fill=%22%23ea580c%22/%3E%3Cpath%20d=%22M30.2%2028h3.6l1.2%208h-6z%22%20fill=%22%23ea580c%22/%3E%3C/svg%3E" />
<meta name="theme-color" content="#ea580c" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="LinkVault" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
:root{--bg:#0b0b0d;--side:#101013;--card:#16161a;--bd:#26262c;--tx:#f4f4f5;--mut:#9a9aa5;--hov:#1f1f25;--inp:#0e0e11;color-scheme:dark}
html.light{--bg:#f5f5f7;--side:#fff;--card:#fff;--bd:#e4e4e8;--tx:#18181b;--mut:#6b6b76;--hov:#f0f0f3;--inp:#fff;color-scheme:light}
body{background:var(--bg);color:var(--tx);font-family:Inter,ui-sans-serif,system-ui,sans-serif;transition:background .2s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#f97316aa;box-shadow:0 8px 24px -12px #f9731655}
.sq{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:8px;background:var(--hov);border:1px solid var(--bd);color:var(--mut);transition:.15s}
.sq:hover{color:var(--tx);border-color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:36px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--hov)}
.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}.pri:hover{background:var(--tx);opacity:.88}
.inp{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;color:var(--tx)}
.inp:focus{border-color:#f97316}
.mut{color:var(--mut)}
.menu{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 16px 40px -8px #0008;padding:4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;font-size:14px;text-align:left;border-radius:6px}
.mi:hover,.mi.on{background:var(--hov)}.danger{color:#f43f5e}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--mut)}
.nav:hover{background:var(--hov);color:var(--tx)}.nav.on{background:var(--hov);color:var(--tx)}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--hov);border:1px solid var(--bd);color:var(--mut)}
.chip.on{background:#f97316;color:#fff;border-color:#f97316}
.ov{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

const loadJSON = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { alert('Browser storage is full - try a smaller banner image.'); } };
const normalizeUrl = u => (/^https?:\/\//i.test(u) ? u : `https://${u}`);
const getDomain = u => { try { return new URL(normalizeUrl(u)).hostname.replace(/^www\./, ''); } catch { return ''; } };
const LOGO = 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23fb923c%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23ea580c%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2216%22%20fill=%22url%28%23g%29%22/%3E%3Cpath%20d=%22M20%2013h24a3%203%200%200%201%203%203v35l-15-9-15%209V16a3%203%200%200%201%203-3z%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2225%22%20r=%224.5%22%20fill=%22%23ea580c%22/%3E%3Cpath%20d=%22M30.2%2028h3.6l1.2%208h-6z%22%20fill=%22%23ea580c%22/%3E%3C/svg%3E';
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);

const COLS = [
  { id: 'entertainment', name: 'Entertainment', icon: '🎮' },
  { id: 'development', name: 'Development', icon: '💻' },
  { id: 'design', name: 'Design Resources', icon: '🎨' },
  { id: 'reading', name: 'Reading List', icon: '📖' },
  { id: 'tools', name: 'Tools', icon: '🛠️' },
];
const U = id => `https://images.unsplash.com/${id}?q=80&w=800&auto=format&fit=crop`;
const PRESET = {
  'youtube.com': U('photo-1611162617213-7d7a39e9b1d7'), 'twitch.tv': U('photo-1542751371-adc38448a05e'),
  'github.com': U('photo-1618401471353-b98aedd04e11'), 'figma.com': U('photo-1609921212029-bb5a28e60960'),
  'react.dev': U('photo-1633356122544-f134324a6cee'), 'spotify.com': U('photo-1614680376593-902f749f7b9c'),
};
const mk = (id, title, url, description, collection, tags) => ({ id, title, url, description, collection, tags, isFavorite: true, status: 'active', createdAt: Date.now() - id * 1000, bannerUrl: PRESET[getDomain(url)] || null });
const SEED = [
  mk(1, 'Twitch', 'https://twitch.tv', 'Live streaming platform for gamers, esports, music, and creative broadcasts.', 'entertainment', ['streaming']),
  mk(2, 'YouTube', 'https://youtube.com', 'Watch videos, live streams, music, and tutorials from creators worldwide.', 'entertainment', ['video']),
  mk(3, 'GitHub', 'https://github.com', 'Where the world builds software. Code hosting, version control, and collaboration.', 'development', ['code']),
  mk(4, 'React Docs', 'https://react.dev', 'The official documentation for React - the library for web and native user interfaces.', 'development', ['code', 'docs']),
  mk(5, 'Figma', 'https://figma.com', 'The collaborative interface design tool for teams to craft visual experiences.', 'design', ['design']),
].map(b => ({ ...b, id: String(b.id) }));

const P = {
  open: <><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></>,
  copy: <><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>,
  edit: <><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></>,
  archive: <><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></>,
  trash: <><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
  restore: <><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></>,
  check: <path d="M20 6 9 17l-5-5"/>,
  sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></>,
  moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
  filter: <path d="M3 6h18M7 12h10M10 18h4"/>,
  sort: <path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/>,
  grid: <><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></>,
  list: <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>,
  search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
  plus: <path d="M5 12h14M12 5v14"/>,
  heart: <path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>,
  dots: <><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></>,
  panel: <><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></>,
  bookmark: <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/>,
  star: <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3-6.2 3.3L7 14.2 2 9.3l6.9-1L12 2Z"/>,
  folder: <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>,
  tag: <><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4Z"/><circle cx="7.5" cy="7.5" r=".5"/></>,
  chevron: <path d="m6 9 6 6 6-6"/>,
  x: <path d="M18 6 6 18M6 6l12 12"/>,
  image: <><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></>,
};
const Icon = ({ name, className = 'w-4 h-4', fill }) => (
  <svg className={className} viewBox="0 0 24 24" fill={fill ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{P[name]}</svg>
);

// Portal popover: never clipped by cards, flips up when low on space, stays on-screen.
function Pop({ rect, onClose, w = 192, children }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    const h = ref.current.getBoundingClientRect().height, pad = 8;
    let top = rect.bottom + 6;
    if (top + h > innerHeight - pad) top = Math.max(pad, rect.top - 6 - h);
    setPos({ top, left: Math.min(Math.max(pad, rect.right - w), innerWidth - w - pad) });
  }, [rect, w]);
  useEffect(() => {
    const down = e => { if (ref.current && !ref.current.contains(e.target) && !e.target.closest('[data-trig]') && !e.target.closest('[role=menu]')) onClose(); };
    const key = e => e.key === 'Escape' && onClose();
    document.addEventListener('mousedown', down); document.addEventListener('keydown', key);
    window.addEventListener('resize', onClose); const sc = e => { if (!(ref.current && ref.current.contains(e.target))) onClose(); };
    window.addEventListener('scroll', sc, true);
    return () => { document.removeEventListener('mousedown', down); document.removeEventListener('keydown', key); window.removeEventListener('resize', onClose); window.removeEventListener('scroll', sc, true); };
  }, [onClose]);
  return ReactDOM.createPortal(
    <div ref={ref} role="menu" className="menu" style={{ position: 'fixed', width: w, zIndex: 100, maxHeight: 280, overflowY: 'auto', top: pos ? pos.top : 0, left: pos ? pos.left : 0, visibility: pos ? 'visible' : 'hidden' }}>{children}</div>,
    document.body);
}

function Favicon({ url, title, big }) {
  const d = getDomain(url);
  const srcs = d ? [`https://www.google.com/s2/favicons?domain=${d}&sz=128`, `https://icons.duckduckgo.com/ip3/${d}.ico`] : [];
  const [i, setI] = useState(0);
  useEffect(() => setI(0), [d]);
  if (i >= srcs.length) return <span className={`font-bold uppercase ${big ? 'text-3xl' : 'text-lg'}`}>{(title || d || '?')[0]}</span>;
  return <img src={srcs[i]} alt="" className={`${big ? 'w-10 h-10' : 'w-6 h-6'} rounded object-contain`} onError={() => setI(i + 1)} />;
}

// Custom dropdown (replaces the native <select>)
function Select({ value, onChange, options }) {
  const [r, setR] = useState(null);
  const cur = options.find(o => o.value === value) || options[0];
  return (<>
    <button type="button" data-trig className="inp flex items-center gap-2 text-left" onClick={e => setR(r ? null : e.currentTarget.getBoundingClientRect())}>
      <span className="flex-1 truncate">{cur ? cur.label : ''}</span><Icon name="chevron" className="w-4 h-4 mut" />
    </button>
    {r && <Pop rect={r} w={r.width} onClose={() => setR(null)}>
      {options.map(o => <button type="button" key={o.value} className={`mi ${o.value === value ? 'on' : ''}`} onClick={() => { onChange(o.value); setR(null); }}><span className="flex-1 truncate">{o.label}</span>{o.value === value && <Icon name="check" />}</button>)}
    </Pop>}
  </>);
}

function Cover({ b, href }) {
  const [bad, setBad] = useState(false);
  useEffect(() => setBad(false), [b.bannerUrl]);
  return (
    <a href={href} target="_blank" rel="noopener noreferrer" tabIndex={-1} className="absolute inset-0 grid place-items-center overflow-hidden">
      {b.bannerUrl && !bad
        ? <img src={b.bannerUrl} alt="" loading="lazy" className="w-full h-full object-cover" onError={() => setBad(true)} />
        : <div className="w-16 h-16 rounded-2xl grid place-items-center border shadow-lg" style={{ background: 'var(--card)', borderColor: 'var(--bd)' }}><Favicon url={b.url} title={b.title} big /></div>}
    </a>
  );
}

const EMPTY = { title: '', url: '', description: '', collection: '', tags: '', banner: '', isFavorite: false };

function App() {
  const [bookmarks, setBookmarks] = useState(() => {
    const s = loadJSON('linkvault_bookmarks', null);
    return Array.isArray(s) ? s.map(b => ({ status: 'active', tags: [], createdAt: Number(b.id) || 0, ...b })) : SEED;
  });
  const [collections, setCollections] = useState(() => { const s = loadJSON('linkvault_collections', null); return Array.isArray(s) ? s : COLS; });
  const [theme, setTheme] = useState(() => loadJSON('linkvault_theme', 'dark'));
  const [view, setView] = useState(() => loadJSON('linkvault_view', 'grid'));
  const [sort, setSort] = useState(() => loadJSON('linkvault_sort', 'new'));
  const [side, setSide] = useState(true);
  const [tab, setTab] = useState('all');
  const [col, setCol] = useState(null);
  const [q, setQ] = useState('');
  const [f, setF] = useState({ col: '', fav: false, banner: false, tag: '' });
  const [pop, setPop] = useState(null);
  const [form, setForm] = useState(EMPTY);
  const [editingId, setEditingId] = useState(null);
  const [modal, setModal] = useState(false);
  const [colModal, setColModal] = useState(false);
  const [newCol, setNewCol] = useState({ name: '', icon: '📌' });
  const [toast, setToast] = useState('');
  const searchRef = useRef(null);
  const closePop = useCallback(() => setPop(null), []);

  useEffect(() => saveJSON('linkvault_bookmarks', bookmarks), [bookmarks]);
  useEffect(() => saveJSON('linkvault_collections', collections), [collections]);
  useEffect(() => saveJSON('linkvault_view', view), [view]);
  useEffect(() => saveJSON('linkvault_sort', sort), [sort]);
  useEffect(() => { document.documentElement.className = theme; saveJSON('linkvault_theme', theme); }, [theme]);
  useEffect(() => {
    const k = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
      if (e.key === 'Escape') { setModal(false); setColModal(false); }
    };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);

  const say = m => { setToast(m); setTimeout(() => setToast(''), 1600); };
  const patch = (id, p) => setBookmarks(prev => prev.map(b => b.id === id ? { ...b, ...p } : b));
  const setStatus = (id, status) => { patch(id, { status }); closePop(); say(status === 'trashed' ? 'Moved to trash' : status === 'archived' ? 'Archived' : 'Restored'); };
  const deleteForever = id => { if (confirm('Delete this link permanently?')) setBookmarks(p => p.filter(b => b.id !== id)); closePop(); };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
    closePop(); say('Link copied');
  };
  const openAdd = () => { setEditingId(null); setForm({ ...EMPTY, collection: collections[0] ? collections[0].id : '' }); setModal(true); };
  const openEdit = b => { setEditingId(b.id); setForm({ title: b.title, url: b.url, description: b.description || '', collection: b.collection, tags: (b.tags || []).join(', '), banner: b.bannerUrl || '', isFavorite: !!b.isFavorite }); setModal(true); closePop(); };

  const pickImage = file => {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 800 / img.width), c = document.createElement('canvas');
        c.width = img.width * s; c.height = img.height * s;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        setForm(p => ({ ...p, banner: c.toDataURL('image/jpeg', 0.8) }));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  };

  const submit = e => {
    e.preventDefault();
    if (!form.title.trim() || !form.url.trim()) return;
    const tags = [...new Set(form.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean))];
    const base = { title: form.title.trim(), url: form.url.trim(), description: form.description.trim(), collection: form.collection, tags, isFavorite: form.isFavorite };
    if (editingId) patch(editingId, { ...base, bannerUrl: form.banner || null });
    else setBookmarks(p => [{ id: Date.now().toString(), status: 'active', createdAt: Date.now(), ...base, bannerUrl: form.banner || PRESET[getDomain(form.url)] || null }, ...p]);
    setModal(false); say(editingId ? 'Changes saved' : 'Link added');
  };

  const addCollection = e => {
    e.preventDefault();
    if (!newCol.name.trim()) return;
    const base = newCol.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'collection';
    let id = base, n = 2; while (collections.some(c => c.id === id)) id = `${base}-${n++}`;
    setCollections(p => [...p, { id, name: newCol.name.trim(), icon: newCol.icon || '📌' }]);
    setNewCol({ name: '', icon: '📌' }); setColModal(false);
  };

  const active = bookmarks.filter(b => b.status === 'active');
  const allTags = [...new Set(active.flatMap(b => b.tags || []))].sort();
  const nFilters = [f.col, f.fav, f.banner, f.tag].filter(Boolean).length;
  const ql = q.toLowerCase();
  const shown = bookmarks.filter(b => {
    if (ql && !(b.title + ' ' + b.url + ' ' + (b.description || '') + ' ' + (b.tags || []).join(' ')).toLowerCase().includes(ql)) return false;
    if (tab === 'trash') return b.status === 'trashed';
    if (tab === 'archive') return b.status === 'archived';
    if (b.status !== 'active') return false;
    if (col && b.collection !== col) return false;
    if (tab === 'fav' && !b.isFavorite) return false;
    if (f.col && b.collection !== f.col) return false;
    if (f.fav && !b.isFavorite) return false;
    if (f.banner && !b.bannerUrl) return false;
    if (f.tag && !(b.tags || []).includes(f.tag)) return false;
    return true;
  }).sort((a, b) => sort === 'name' ? a.title.localeCompare(b.title) : sort === 'old' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

  const count = s => bookmarks.filter(b => b.status === s).length;
  const title = col ? (collections.find(c => c.id === col) || {}).name : { all: 'All Bookmarks', fav: 'Favorites', archive: 'Archive', trash: 'Trash' }[tab];
  const nav = (t, c = null) => { setTab(t); setCol(c); };
  const trig = (id, type) => e => { const r = e.currentTarget.getBoundingClientRect(); setPop(pop && pop.id === id && pop.type === type ? null : { id, type, rect: r }); };
  const popBm = pop && pop.type === 'menu' ? bookmarks.find(b => b.id === pop.id) : null;

  const stats = [
    ['bookmark', active.length, 'Total Bookmarks', 'text-blue-500 bg-blue-500/10'],
    ['star', active.filter(b => b.isFavorite).length, 'Favorites', 'text-amber-500 bg-amber-500/10'],
    ['folder', collections.length, 'Collections', 'text-purple-500 bg-purple-500/10'],
    ['tag', allTags.length, 'Tags Used', 'text-emerald-500 bg-emerald-500/10'],
  ];
  const NavBtn = ({ on, onClick, icon, label, n }) => (
    <button onClick={onClick} className={`nav ${on ? 'on' : ''}`}><span className="flex items-center gap-2.5"><span className="w-5 text-center">{icon}</span>{label}</span><span className="text-xs mut">{n}</span></button>
  );

  return (
    <div className="flex h-screen overflow-hidden">
      {side && (
        <aside className="w-64 flex-none flex flex-col border-r" style={{ background: 'var(--side)', borderColor: 'var(--bd)' }}>
          <div className="p-4 flex-1 overflow-y-auto space-y-5">
            <div className="flex items-center gap-2.5 px-1">
              <img src={LOGO} alt="LinkVault" className="w-9 h-9 rounded-[10px] shadow-lg shadow-orange-600/30" />
              <span className="font-bold text-xl tracking-tight">Link<span className="text-orange-500">Vault</span></span>
            </div>
            <nav className="space-y-0.5">
              <NavBtn on={tab === 'all' && !col} onClick={() => nav('all')} icon="📑" label="All Bookmarks" n={count('active')} />
              <NavBtn on={tab === 'fav' && !col} onClick={() => nav('fav')} icon="❤️" label="Favorites" n={active.filter(b => b.isFavorite).length} />
              <NavBtn on={tab === 'archive'} onClick={() => nav('archive')} icon="🗄️" label="Archive" n={count('archived')} />
              <NavBtn on={tab === 'trash'} onClick={() => nav('trash')} icon="🗑️" label="Trash" n={count('trashed')} />
            </nav>
            <div>
              <div className="flex items-center justify-between px-2.5 mb-1.5 text-[11px] font-semibold tracking-wider uppercase mut">
                <span>Collections</span>
                <button onClick={() => setColModal(true)} className="hover:text-orange-500 flex items-center gap-1"><Icon name="plus" className="w-3 h-3" />New</button>
              </div>
              <div className="space-y-0.5">
                {collections.map(c => <NavBtn key={c.id} on={col === c.id} onClick={() => nav('collection', c.id)} icon={c.icon} label={c.name} n={active.filter(b => b.collection === c.id).length} />)}
              </div>
            </div>
          </div>
          <div className="p-4 border-t text-xs mut flex justify-between" style={{ borderColor: 'var(--bd)' }}><span>LinkVault v1.1.1</span><span className="text-orange-500 font-mono">Personal Vault</span></div>
        </aside>
      )}

      <main className="flex-1 min-w-0 flex flex-col">
        <header className="flex-none flex items-center gap-2 px-4 h-16 border-b" style={{ borderColor: 'var(--bd)' }}>
          <button className="sq" title="Toggle sidebar" onClick={() => setSide(!side)}><Icon name="panel" /></button>
          <h1 className="font-semibold ml-1 mr-auto truncate">{title}</h1>
          <div className="relative hidden md:block w-64">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 mut"><Icon name="search" /></span>
            <input ref={searchRef} value={q} onChange={e => setQ(e.target.value)} placeholder="Search links, tags…" className="inp" style={{ paddingLeft: 36, paddingRight: 64, height: 36 }} />
            <span className="absolute right-2 top-1/2 -translate-y-1/2 chip pointer-events-none">{IS_MAC ? '⌘K' : 'Ctrl K'}</span>
          </div>
          <div className="flex rounded-lg border p-0.5" style={{ borderColor: 'var(--bd)' }}>
            {['grid', 'list'].map(v => <button key={v} title={v + ' view'} onClick={() => setView(v)} className={`w-8 h-7 grid place-items-center rounded-md ${view === v ? 'bg-[var(--hov)]' : 'mut'}`}><Icon name={v} /></button>)}
          </div>
          <button data-trig className="btn" onClick={trig('sort', 'sort')}><Icon name="sort" />{{ new: 'Newest', old: 'Oldest', name: 'A–Z' }[sort]}</button>
          <button data-trig className="btn" onClick={trig('filter', 'filter')}><Icon name="filter" />Filter{nFilters > 0 && <span className="bg-orange-500 text-white text-[11px] rounded-full px-1.5">{nFilters}</span>}</button>
          <button className="btn pri" onClick={openAdd}><Icon name="plus" />Add Bookmark</button>
          <button className="sq" title={theme === 'dark' ? 'Switch to light mode' : 'Switch to night mode'} onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}><Icon name={theme === 'dark' ? 'moon' : 'sun'} /></button>
        </header>

        <div className="flex-1 overflow-y-auto p-6">
          <div className="md:hidden mb-4"><input value={q} onChange={e => setQ(e.target.value)} placeholder="Search…" className="inp" /></div>
          {tab !== 'trash' && tab !== 'archive' && (
            <div className="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-6">
              {stats.map(([ic, n, l, c]) => (
                <div key={l} className="card p-4 flex items-center gap-3">
                  <div className={`w-10 h-10 rounded-lg grid place-items-center ${c}`}><Icon name={ic} className="w-5 h-5" /></div>
                  <div><div className="text-xl font-bold leading-tight">{n}</div><div className="text-xs mut">{l}</div></div>
                </div>
              ))}
            </div>
          )}
          {nFilters > 0 && <button className="chip mb-4" onClick={() => setF({ col: '', fav: false, banner: false, tag: '' })}>Clear {nFilters} filter{nFilters > 1 ? 's' : ''} ✕</button>}

          {shown.length === 0 && <div className="text-center mut text-sm py-20">{tab === 'trash' ? 'Trash is empty.' : tab === 'archive' ? 'Nothing archived.' : 'No links found.'}</div>}

          <div className={view === 'grid' ? 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4' : 'flex flex-col gap-2'}>
            {shown.map(b => {
              const c = collections.find(x => x.id === b.collection);
              const href = normalizeUrl(b.url);
              const list = view === 'list';
              const Actions = (
                <div className="flex gap-1.5 flex-none">
                  <button className={`sq ov ${b.isFavorite ? '!text-rose-500' : ''}`} title="Favorite" onClick={() => patch(b.id, { isFavorite: !b.isFavorite })}><Icon name="heart" fill={b.isFavorite} /></button>
                  <button data-trig className="sq ov" title="More" aria-haspopup="menu" onClick={trig(b.id, 'menu')}><Icon name="dots" /></button>
                </div>
              );
              if (list) return (
                <div key={b.id} className="card flex items-center gap-3 p-3">
                  <div className="sq !w-10 !h-10"><Favicon url={b.url} title={b.title} /></div>
                  <div className="min-w-0 flex-1">
                    <a href={href} target="_blank" rel="noopener noreferrer" className="font-semibold hover:text-orange-500 hover:underline">{b.title}</a>
                    <p className="text-xs mut truncate">{b.description || getDomain(b.url)}</p>
                  </div>
                  <span className="hidden md:block text-xs mut whitespace-nowrap">{c && `${c.icon} ${c.name}`}</span>
                  {Actions}
                </div>
              );
              return (
                <div key={b.id} className="card overflow-hidden flex flex-col">
                  <div className="relative h-32 flex-none" style={{ background: 'var(--hov)' }}>
                    <Cover b={b} href={href} />
                    <div className="absolute top-2.5 right-2.5">{Actions}</div>
                  </div>
                  <div className="p-4 flex-1 flex flex-col">
                    <div className="flex items-center gap-2 min-w-0">
                      {b.bannerUrl && <span className="flex-none w-5 h-5 grid place-items-center"><Favicon url={b.url} title={b.title} /></span>}
                      <a href={href} target="_blank" rel="noopener noreferrer" className="font-semibold text-base tracking-tight truncate hover:text-orange-500 hover:underline">{b.title}</a>
                    </div>
                    <p className="text-sm mut clamp2 mt-1 mb-3 flex-1">{b.description || getDomain(b.url)}</p>
                    {(b.tags || []).length > 0 && <div className="flex flex-wrap gap-1 mb-3">{b.tags.map(t => <button key={t} className="chip" onClick={() => setF({ ...f, tag: t })}>#{t}</button>)}</div>}
                    <div className="flex items-center justify-between text-xs mut pt-3 border-t" style={{ borderColor: 'var(--bd)' }}>
                      <span>{c && `${c.icon} ${c.name}`}</span>
                      <span>{new Date(b.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </main>

      {pop && pop.type === 'sort' && (
        <Pop rect={pop.rect} onClose={closePop} w={160}>
          {[['new', 'Newest first'], ['old', 'Oldest first'], ['name', 'Name A–Z']].map(([k, l]) => (
            <button key={k} className={`mi ${sort === k ? 'on' : ''}`} onClick={() => { setSort(k); closePop(); }}><span className="flex-1">{l}</span>{sort === k && <Icon name="check" />}</button>
          ))}
        </Pop>
      )}
      {pop && pop.type === 'filter' && (
        <Pop rect={pop.rect} onClose={closePop} w={280}>
          <div className="p-3 space-y-3">
            <div><label className="text-xs mut block mb-1">Collection</label>
              <Select value={f.col} onChange={v => setF({ ...f, col: v })} options={[{ value: '', label: 'All collections' }, ...collections.map(c => ({ value: c.id, label: `${c.icon} ${c.name}` }))]} /></div>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={f.fav} onChange={e => setF({ ...f, fav: e.target.checked })} />Favorites only</label>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={f.banner} onChange={e => setF({ ...f, banner: e.target.checked })} />Has banner</label>
            {allTags.length > 0 && <div><label className="text-xs mut block mb-1">Tag</label><div className="flex flex-wrap gap-1">{allTags.map(t => <button key={t} className={`chip ${f.tag === t ? 'on' : ''}`} onClick={() => setF({ ...f, tag: f.tag === t ? '' : t })}>#{t}</button>)}</div></div>}
            <button className="btn w-full justify-center" onClick={() => setF({ col: '', fav: false, banner: false, tag: '' })}>Reset filters</button>
          </div>
        </Pop>
      )}
      {popBm && (
        <Pop rect={pop.rect} onClose={closePop}>
          {popBm.status === 'trashed' ? (<>
            <button className="mi" onClick={() => setStatus(popBm.id, 'active')}><Icon name="restore" />Restore</button>
            <div className="my-1 border-t" style={{ borderColor: 'var(--bd)' }} />
            <button className="mi danger" onClick={() => deleteForever(popBm.id)}><Icon name="trash" />Delete Permanently</button>
          </>) : (<>
            <a className="mi" href={normalizeUrl(popBm.url)} target="_blank" rel="noopener noreferrer" onClick={closePop}><Icon name="open" />Open Link</a>
            <button className="mi" onClick={() => copy(normalizeUrl(popBm.url))}><Icon name="copy" />Copy Link</button>
            <button className="mi" onClick={() => openEdit(popBm)}><Icon name="edit" />Edit</button>
            <button className="mi" onClick={() => setStatus(popBm.id, popBm.status === 'archived' ? 'active' : 'archived')}><Icon name={popBm.status === 'archived' ? 'restore' : 'archive'} />{popBm.status === 'archived' ? 'Unarchive' : 'Archive'}</button>
            <div className="my-1 border-t" style={{ borderColor: 'var(--bd)' }} />
            <button className="mi danger" onClick={() => setStatus(popBm.id, 'trashed')}><Icon name="trash" />Move to Trash</button>
          </>)}
        </Pop>
      )}

      {modal && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm grid place-items-center p-4 z-50 overflow-y-auto" onMouseDown={e => e.target === e.currentTarget && setModal(false)}>
          <form onSubmit={submit} className="card w-full max-w-lg p-6 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between"><h3 className="font-semibold text-lg">{editingId ? 'Edit Link' : 'Add New Link'}</h3><button type="button" className="sq" onClick={() => setModal(false)}><Icon name="x" /></button></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs mut block mb-1">Title</label><input className="inp" required autoFocus value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="e.g. YouTube" /></div>
              <div><label className="text-xs mut block mb-1">URL</label><input className="inp" required value={form.url} onChange={e => setForm({ ...form, url: e.target.value })} placeholder="youtube.com" /></div>
            </div>
            <div><label className="text-xs mut block mb-1">Description</label><textarea className="inp" rows={2} value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} placeholder="Short summary…" /></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs mut block mb-1">Collection</label><Select value={form.collection} onChange={v => setForm({ ...form, collection: v })} options={collections.map(c => ({ value: c.id, label: `${c.icon} ${c.name}` }))} /></div>
              <div><label className="text-xs mut block mb-1">Tags (comma separated)</label><input className="inp" value={form.tags} onChange={e => setForm({ ...form, tags: e.target.value })} placeholder="code, docs" /></div>
            </div>
            <div>
              <label className="text-xs mut block mb-1">Banner (optional)</label>
              {form.banner ? (
                <div className="relative h-32 rounded-lg overflow-hidden border" style={{ borderColor: 'var(--bd)' }}>
                  <img src={form.banner} alt="" className="w-full h-full object-cover" />
                  <button type="button" className="sq absolute top-2 right-2" title="Remove banner" onClick={() => setForm({ ...form, banner: '' })}><Icon name="x" /></button>
                </div>
              ) : <div className="h-20 rounded-lg border border-dashed grid place-items-center text-xs mut" style={{ borderColor: 'var(--bd)' }}>{editingId ? 'No banner' : 'Known sites (YouTube, GitHub…) get one automatically'}</div>}
              <div className="flex gap-2 mt-2">
                <input className="inp" placeholder="Paste image URL…" value={form.banner.startsWith('data:') ? '' : form.banner} onChange={e => setForm({ ...form, banner: e.target.value })} />
                <label className="btn cursor-pointer"><Icon name="image" />Upload<input type="file" accept="image/*" hidden onChange={e => pickImage(e.target.files[0])} /></label>
              </div>
            </div>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.isFavorite} onChange={e => setForm({ ...form, isFavorite: e.target.checked })} />Add to favorites</label>
            <div className="flex justify-end gap-2"><button type="button" className="btn" onClick={() => setModal(false)}>Cancel</button><button type="submit" className="btn pri">{editingId ? 'Save Changes' : 'Save Link'}</button></div>
          </form>
        </div>
      )}

      {colModal && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm grid place-items-center p-4 z-50" onMouseDown={e => e.target === e.currentTarget && setColModal(false)}>
          <form onSubmit={addCollection} className="card w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between"><h3 className="font-semibold text-lg">Create Collection</h3><button type="button" className="sq" onClick={() => setColModal(false)}><Icon name="x" /></button></div>
            <div><label className="text-xs mut block mb-1">Emoji</label><input className="inp text-center" maxLength={2} value={newCol.icon} onChange={e => setNewCol({ ...newCol, icon: e.target.value })} /></div>
            <div><label className="text-xs mut block mb-1">Name</label><input className="inp" required autoFocus value={newCol.name} onChange={e => setNewCol({ ...newCol, name: e.target.value })} placeholder="e.g. Gaming & Streams" /></div>
            <div className="flex justify-end gap-2"><button type="button" className="btn" onClick={() => setColModal(false)}>Cancel</button><button type="submit" className="btn pri">Create</button></div>
          </form>
        </div>
      )}

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 card px-4 py-2 text-sm shadow-2xl z-[120] flex items-center gap-2"><Icon name="check" className="w-4 h-4 text-emerald-500" />{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
// Register the service worker (install + offline). Reload once when a new version takes over.
// When opened as an installed app, fill the whole screen.
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
  try { window.moveTo(0, 0); window.resizeTo(screen.availWidth, screen.availHeight); } catch (e) {}
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    let done = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } });
  });
}
</script>
</body>
</html>
